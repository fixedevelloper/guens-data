spring:
  application:
    name: field-collect-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/field_collect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:base}
    password: ${DB_PASSWORD:ba001133}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    max-failed-attempts: 5
    lock-minutes: 15
    login-rate-limit-per-minute: 20
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    access-ttl-minutes: 30
    refresh-ttl-days: 30
  crypto:
    aes-key-base64: ${AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hash-pepper: ${HASH_PEPPER:dev-pepper}
  storage:
    # Repli disque (dev/tests) utilisé seulement si MINIO_ACCESS_KEY est vide.
    documents-dir: ${DOCS_DIR:./data/documents}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:field-collect}
      # URL publique si différente de l'endpoint interne (reverse proxy, domaine public)
      public-url: ${MINIO_PUBLIC_URL:${MINIO_ENDPOINT:http://localhost:9000}}
  bootstrap-admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:Admin#12345}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
